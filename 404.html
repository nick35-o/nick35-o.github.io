:root{--ink:#272B57;--paper:#FCFBF8;--red:#C83C46;--mute:#5d6085;--line:#d9d5c8}
@media(prefers-color-scheme:dark){:root{--ink:#E9E6DC;--paper:#14162B;--red:#E5646D;--mute:#a3a6c7;--line:#2c3052}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:1.5rem;background:radial-gradient(640px 420px at 85% -5%,color-mix(in srgb,var(--red) 12%,transparent),transparent 62%),radial-gradient(560px 420px at 0% 100%,color-mix(in srgb,var(--ink) 9%,transparent),transparent 62%),var(--paper);color:var(--ink);font:400 1.0625rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
main{text-align:center;max-width:30rem;position:relative;z-index:1}
.t{width:92px;height:92px;margin:0 auto 1rem;animation:in 1s .1s both cubic-bezier(.2,.7,.2,1)}
.t path,.t rect{fill:var(--red)}
.n{font:400 clamp(5.5rem,26vw,9.5rem)/.9 Newsreader,Georgia,serif;margin:0;letter-spacing:-.02em;animation:in 1s .25s both cubic-bezier(.2,.7,.2,1)}
h1{font:400 clamp(1.4rem,5vw,1.9rem)/1.25 Newsreader,Georgia,serif;margin:1rem 0 .3rem;animation:in 1s .4s both cubic-bezier(.2,.7,.2,1)}
.j{margin:0;color:var(--mute);font-size:.95rem;animation:in 1s .5s both cubic-bezier(.2,.7,.2,1)}
p.d{color:var(--mute);margin:.9rem 0 1.6rem;animation:in 1s .6s both cubic-bezier(.2,.7,.2,1)}
a{display:inline-block;padding:.7rem 1.5rem;border:1px solid var(--ink);border-radius:2rem;color:var(--ink);text-decoration:none;transition:background .3s,color .3s,transform .3s;animation:in 1s .75s both cubic-bezier(.2,.7,.2,1)}
a:hover,a:focus-visible{background:var(--ink);color:var(--paper);transform:translateY(-2px);outline:none}
@keyframes in{from{opacity:0;transform:translateY(14px);filter:blur(8px)}}
.sk{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sk i{position:absolute;top:-24px;width:10px;height:10px;border-radius:80% 0 80% 0;background:#f2a9b8;opacity:0;animation:f linear infinite}
.sk i:nth-child(1){left:10%;animation-duration:15s}.sk i:nth-child(2){left:30%;width:7px;height:7px;animation-duration:19s;animation-delay:4s}
.sk i:nth-child(3){left:52%;animation-duration:17s;animation-delay:8s}.sk i:nth-child(4){left:70%;width:8px;height:8px;animation-duration:21s;animation-delay:2s}
.sk i:nth-child(5){left:88%;animation-duration:18s;animation-delay:6s}
@keyframes f{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:.7}50%{transform:translate(-40px,52vh) rotate(200deg)}100%{transform:translate(20px,108vh) rotate(420deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
